info:
  name: Invalid Login
  type: http
  seq: 3.1

http:
  method: POST
  url: http://167.99.2.103/API/Login.php
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "testuser",
        "password": "WRONG_PASSWORD"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Confirms that incorrect credentials are rejected with HTTP 401.
