info:
  name: Change User Password
  type: http
  seq: 11

http:
  method: POST
  url: http://167.99.2.103/API/ChangeUserPassword.php
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer 1
  body:
    type: json
    data: |-
      {
        "userId": 2,
        "newPassword": "NewPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Changes a user's password. The PHP endpoint must hash the new password before saving it.
