info:
  name: Health Check
  type: http
  seq: 1

http:
  method: GET
  url: http://167.99.2.103/API/health.php

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Confirms that Apache and PHP are reachable on the development droplet.
