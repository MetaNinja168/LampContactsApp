info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: http://167.99.2.103/API/Login.php
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "testuser",
        "password": "ChangeMe123!"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Required presentation request. Logs in a user, rejects disabled accounts, and returns the user's role.
