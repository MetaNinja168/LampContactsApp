info:
  name: Get Contact
  type: http
  seq: 5.1

http:
  method: GET
  url: http://167.99.2.103/API/GetContact.php?id=1
  headers:
    - name: Authorization
      value: Bearer 1
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Retrieves one contact by ID and must verify that the authenticated user owns it, unless the caller is an Admin.
