info:
  name: Login With New Password
  type: http
  seq: 16

http:
  method: POST
  url: http://167.99.2.103/API/Login.php
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "login": "testuser",
        "password": "NewPassword123!"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Required demo: proves that the user can log in after the Admin changes the password.
